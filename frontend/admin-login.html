<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Administrador</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/styles.css" rel="stylesheet">
  </head>
  <body>
    <div class="brand-strip"></div>
    <main class="container py-5">
      <section class="mx-auto panel" style="max-width: 420px;">
        <h1 class="h3 fw-bold text-center mb-4">Administrador</h1>
        <form id="adminLoginForm" class="vstack gap-3">
          <input id="adminPassword" class="form-control form-control-lg" type="password" placeholder="Contraseña" autocomplete="current-password" required autofocus>
          <button class="btn btn-success btn-lg" type="submit">Entrar</button>
          <small id="adminLoginStatus" class="text-danger text-center"></small>
        </form>
      </section>
    </main>

    <script>
      document.querySelector("#adminLoginForm").addEventListener("submit", async (event) => {
        event.preventDefault();
        const status = document.querySelector("#adminLoginStatus");
        const password = document.querySelector("#adminPassword").value;
        const next = new URLSearchParams(window.location.search).get("next") || "/admin";
        status.textContent = "";

        const response = await fetch("/api/admin/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password }),
          cache: "no-store",
        });

        if (!response.ok) {
          status.textContent = "Contraseña incorrecta.";
          return;
        }

        window.location.href = next;
      });
    </script>
  </body>
</html>
