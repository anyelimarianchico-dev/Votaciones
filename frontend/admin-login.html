<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Administrador</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="css/styles.css" rel="stylesheet">
  </head>
  <body>
    <div class="brand-strip"></div>
    <main class="container py-5">
      <section class="mx-auto panel" style="max-width: 420px;">
        <h1 class="h3 fw-bold text-center mb-4">Administrador</h1>
        <form id="adminLoginForm" class="vstack gap-3" method="post" action="http://127.0.0.1:5000/admin-login">
          <input id="adminNext" type="hidden" name="next" value="admin.html">
          <div class="password-field">
            <input id="adminPassword" name="password" class="form-control form-control-lg" type="password" placeholder="Contraseña" autocomplete="current-password" required autofocus>
            <button id="toggleAdminPassword" class="password-toggle" type="button" aria-label="Mostrar contraseña" aria-pressed="false">
              <i class="bi bi-eye"></i>
            </button>
          </div>
          <button class="btn btn-success btn-lg" type="submit">Entrar</button>
          <small id="adminLoginStatus" class="text-danger text-center"></small>
        </form>
      </section>
    </main>

    <script>
      const ADMIN_PASSWORD = "Adminos_2026";
      const params = new URLSearchParams(window.location.search);
      const next = params.get("next");
      if (next) document.querySelector("#adminNext").value = next.replace(/^\/+/, "");
      if (params.get("error") === "1") {
        document.querySelector("#adminLoginStatus").textContent = "Contraseña incorrecta.";
      }

      const isFlaskOrigin = ["127.0.0.1:5000", "localhost:5000"].includes(window.location.host);
      const form = document.querySelector("#adminLoginForm");
      const passwordInput = document.querySelector("#adminPassword");
      const togglePassword = document.querySelector("#toggleAdminPassword");

      togglePassword.addEventListener("click", () => {
        const shouldShow = passwordInput.type === "password";
        passwordInput.type = shouldShow ? "text" : "password";
        togglePassword.setAttribute("aria-label", shouldShow ? "Ocultar contraseña" : "Mostrar contraseña");
        togglePassword.setAttribute("aria-pressed", String(shouldShow));
        togglePassword.innerHTML = `<i class="bi ${shouldShow ? "bi-eye-slash" : "bi-eye"}"></i>`;
        passwordInput.focus();
      });

      if (isFlaskOrigin) {
        form.action = "/admin-login";
      } else {
        form.addEventListener("submit", (event) => {
          event.preventDefault();
          const password = document.querySelector("#adminPassword").value.trim();
          const nextPage = document.querySelector("#adminNext").value || "admin.html";
          if (password !== ADMIN_PASSWORD) {
            document.querySelector("#adminLoginStatus").textContent = "Contraseña incorrecta.";
            return;
          }
          sessionStorage.setItem("sena_admin_authenticated", "true");
          sessionStorage.setItem("sena_admin_key", password);
          window.location.href = nextPage;
        });
      }
    </script>
  </body>
</html>
