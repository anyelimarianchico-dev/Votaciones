<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Administrador</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/styles.css" rel="stylesheet">
  </head>
  <body>
    <div class="brand-strip"></div>
    <main class="container py-5">
      <section class="mx-auto panel" style="max-width: 420px;">
        <h1 class="h3 fw-bold text-center mb-4">Administrador</h1>
        <form id="adminLoginForm" class="vstack gap-3" method="post" action="http://127.0.0.1:5000/admin-login">
          <input id="adminNext" type="hidden" name="next" value="admin.html">
          <input id="adminPassword" name="password" class="form-control form-control-lg" type="password" placeholder="Contraseña" autocomplete="current-password" required autofocus>
          <button class="btn btn-success btn-lg" type="submit">Entrar</button>
          <small id="adminLoginStatus" class="text-danger text-center"></small>
        </form>
      </section>
    </main>

    <script>
      const params = new URLSearchParams(window.location.search);
      const next = params.get("next");
      if (next) document.querySelector("#adminNext").value = next.replace(/^\/+/, "");
      if (params.get("error") === "1") {
        document.querySelector("#adminLoginStatus").textContent = "Contraseña incorrecta.";
      }
    </script>
  </body>
</html>
